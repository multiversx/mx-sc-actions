name: Build contracts deterministically

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
        description: Image tag for multiversx/sdk-rust-contract-builder
      project_path:
        type: string
        default: '.'
        required: false
        description: A specific project path
      contract_name:
        type: string
        required: false
        description: A specific contract, or a list of contracts separated by commas or spaces, to be built
      create_release:
        type: boolean
        description: Whether to create a new release
      attach_to_existing_release:
        type: boolean
        description: Whether to attach output to existing release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.create_release }}" == "true" && "${{ inputs.attach_to_existing_release }}" == "true" ]]; then
            echo "ERROR: Choose either create_release or attach_to_existing_release, not both."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install sc-meta
        run: cargo install multiversx-sc-meta --locked

      - name: Build contracts
        run: |
          output=/home/runner/work/output-from-docker
          build() {
            sc-meta reproducible-build build \
              --docker-image "multiversx/sdk-rust-contract-builder:${IMAGE_TAG}" \
              --project "${PROJECT_PATH}" \
              --no-docker-tty \
              --no-docker-interactive \
              "$@"
          }

          read -r -a contracts <<< "${CONTRACT_NAME//,/ }"
          if [[ ${#contracts[@]} -eq 0 ]]; then
            build --output "$output"
            exit 0
          fi

          # sc-meta builds one contract at a time: build each one, then gather
          # the outputs in one folder with a single artifacts.json.
          mkdir -p "$output"
          for contract in "${contracts[@]}"; do
            build --contract "$contract" --output "$RUNNER_TEMP/rb/$contract"
            if ! jq -e '.contracts | length > 0' "$RUNNER_TEMP/rb/$contract/artifacts.json" > /dev/null; then
              echo "ERROR: contract '$contract' not found in the project."
              exit 1
            fi
            cp -R "$RUNNER_TEMP/rb/$contract/$contract" "$output/"
          done
          jq -s --arg contracts "${contracts[*]}" \
            '.[0] + {buildOptions: (.[0].buildOptions + {specificContract: $contracts}), contracts: (map(.contracts) | add)}' \
            "$RUNNER_TEMP"/rb/*/artifacts.json > "$output/artifacts.json"
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROJECT_PATH: ${{ inputs.project_path }}
          CONTRACT_NAME: ${{ inputs.contract_name }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: /home/runner/work/output-from-docker/**/*.*
          if-no-files-found: error

      - name: Create new release (if applicable)
        if: ${{ inputs.create_release == true }}
        run: |
          gh release create "${{ github.ref_name }}" --target="$GITHUB_SHA" --prerelease --title="New release: ${{ github.ref_name }}" --generate-notes
          # Give some time for processing the request
          sleep 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notes
        if: ${{ inputs.attach_to_existing_release == true || inputs.create_release == true }}
        run: |
          sc-meta reproducible-build release-notes \
            --artifacts /home/runner/work/output-from-docker/artifacts.json \
            --docker-image "multiversx/sdk-rust-contract-builder:${{ inputs.image_tag }}" \
            --output build_notes.txt

          # Keep the existing release notes (e.g. the generated "What's Changed") and add the build notes after them.
          existing_notes="$(gh release view "${{ github.ref_name }}" --json body --jq .body)"
          if [[ -n "$existing_notes" ]]; then
            printf '%s\n\n' "$existing_notes" > release_notes.txt
          fi
          cat build_notes.txt >> release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release, edit release notes
        if: ${{ inputs.attach_to_existing_release == true || inputs.create_release == true }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file=release_notes.txt

          gh release upload "${{ github.ref_name }}" $(find /home/runner/work/output-from-docker -name "*.wasm" -type f)
          gh release upload "${{ github.ref_name }}" $(find /home/runner/work/output-from-docker -name "*.source.json" -type f)
          gh release upload "${{ github.ref_name }}" $(find /home/runner/work/output-from-docker -name "*.abi.json" -type f)
          gh release upload "${{ github.ref_name }}" $(find /home/runner/work/output-from-docker -name "artifacts.json" -type f)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
